version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: github-agent-chromadb
    volumes:
      - ./chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: github-agent-ollama
    volumes:
      - ./ollama-data:/root/.ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "/bin/ollama serve & sleep 5 && ollama pull nomic-embed-text || true && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    # Para usar GPU NVIDIA, instale o NVIDIA Container Toolkit e descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: github-agent
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      CHROMA_URL: http://chromadb:8000
      OLLAMA_URL: http://ollama:11434
      REPO_LOCAL_PATH: /workspace/repo
      TZ: America/Sao_Paulo
    env_file:
      - .env
    volumes:
      # O repositório alvo — clone aqui antes de subir o agente
      - ./workspace/repo:/workspace/repo
      # Logs persistem entre restarts
      - ./logs:/app/logs
    restart: unless-stopped

  # Serviço auxiliar para indexar o repositório (roda uma vez e sai)
  indexer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: github-agent-indexer
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      CHROMA_URL: http://chromadb:8000
      OLLAMA_URL: http://ollama:11434
      REPO_LOCAL_PATH: /workspace/repo
    env_file:
      - .env
    volumes:
      - ./workspace/repo:/workspace/repo
    command: ["node", "dist/rag/indexer.js"]
    profiles:
      - indexer # só sobe quando explicitamente pedido
